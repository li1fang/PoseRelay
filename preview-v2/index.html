<main><h1>PoseRelay V2 预览</h1><p>试玩两套定稿角色。龙宝能边说边转头，小克会提起腰带再回到正面。</p><section class="grid"><article><img src="./dragon/assets/poses/3571e9464e1444192c4a8927c004340c678ecac3fc53c468c3a4c7c0b31e7589.png" alt="龙宝 · 头像"><div class="details"><h2>龙宝 · 头像</h2><p>先点「试听台词」，再点「左看」。去程 2×，台词原速。台词结束后点「正面」体验 1× 回程。</p><div class="actions"><a class="primary" href="./dragon/">打开试玩</a><a href="https://github.com/li1fang/PoseRelay/releases/download/v0.2.0-preview.1/PoseRelay-Dragon-Avatar.zip">下载离线包</a></div></div></article><article><img src="./claude/assets/poses/cdc80b7404faef0094ec2bb05f21dc1cf81a012f1025f8c40d8099a94f99d94e.png" alt="小克 · 军装"><div class="details"><h2>小克 · 军装</h2><p>先点「右看」，再点「正面」。观察抓带、提起、松手。到正面后可以试听台词。</p><div class="actions"><a class="primary" href="./claude/">打开试玩</a><a href="https://github.com/li1fang/PoseRelay/releases/download/v0.2.0-preview.1/PoseRelay-Claude-Uniform.zip">下载离线包</a></div></div></article></section>
