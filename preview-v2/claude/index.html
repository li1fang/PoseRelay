<!doctype html>
<html lang="zh-CN" data-standalone>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PoseRelay · 项目实播</title>
<link rel="stylesheet" href="./style.css">
<header><a class="brand" href="./">PoseRelay</a><a href="./en.html" lang="en">English</a></header>
<main class="project-player">
  <section aria-labelledby="player-title">
    <h1 id="player-title">项目实播</h1>
    <div class="player-workspace">
      <canvas id="figure" width="512" height="512" aria-label="角色实播"></canvas>
      <div class="player-controls">
        <output id="status" aria-live="polite">正在载入角色</output>
        <p id="pending"></p>
        <nav id="poses" aria-label="选择姿态"></nav>
        <div class="actions">
          <button id="voice" class="primary" disabled>试听台词</button>
          <button id="cancel" disabled>取消转场</button>
          <button id="blink" disabled>眨眼</button>
        </div>
        <p id="speech-hint" class="hint"></p>
        <div class="actions">
          <label>呼吸 <select id="breath" disabled><option value="low">低</option><option value="medium" selected>中</option><option value="high">高</option></select></label>
          <label>受击 <select id="impact" disabled><option value="low">轻</option><option value="medium">中</option><option value="high">重</option></select></label>
          <label>方向 <select id="impact-side" disabled><option value="both">双侧</option><option value="left">角色左侧</option><option value="right">角色右侧</option></select></label>
          <button id="hit" disabled>触发受击</button>
        </div>
        <details>
          <summary>眨眼设置</summary>
          <div class="fields">
            <label>时长（毫秒）<input id="duration" type="number" min="100" max="700" step="10" value="260" disabled></label>
            <label>间隔（毫秒）<input id="interval" type="number" min="500" max="12000" step="100" value="4100" disabled></label>
          </div>
        </details>
      </div>
    </div>
  </section>
</main>
<script src="./sha256.js"></script>
<script src="./lan-digest.js"></script>
<script type="module" src="./project-stage.mjs"></script>
</html>
